name: ClickHouse Audit

on:
  workflow_dispatch:
    inputs:
      tts_app_version:
        description: Optional exact TTS commit SHA for a focused read-only outcome check
        required: false
        type: string
      resources_only:
        description: Read only ClickHouse memory, merge and table-size diagnostics
        required: false
        type: boolean
        default: false
      apply_recovery:
        description: Apply the approved two-task configuration and restart ClickHouse without deleting data
        required: false
        type: boolean
        default: false
      detach_archives:
        description: Detach only the three remaining approved system log archives, preserving data
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    if: ${{ !inputs.apply_recovery && !inputs.detach_archives }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Query aggregate telemetry state
        if: inputs.tts_app_version == '' && !inputs.resources_only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          printf -v remote_command 'cd %q && docker compose exec -T clickhouse sh -s' "$VPS_DEPLOY_PATH"
          ssh "$VPS_USER@$VPS_HOST" "$remote_command" <<'REMOTE'
          set -eu
          query() {
            clickhouse-client --user "$CLICKHOUSE_ADMIN_USER" --password "$CLICKHOUSE_ADMIN_PASSWORD" --format TSVWithNames --query "$1"
          }
          printf '\n== snapshot ==\n'
          query "SELECT now('UTC') AS captured_at, version() AS clickhouse_version"
          printf '\n== migrations ==\n'
          query "SELECT version, name, applied_at FROM linka_metric.schema_migrations FINAL ORDER BY version"
          printf '\n== table sizes ==\n'
          query "SELECT table, formatReadableSize(sum(bytes_on_disk)) AS size, sum(rows) AS rows FROM system.parts WHERE database = 'linka_metric' AND active GROUP BY table ORDER BY sum(bytes_on_disk) DESC"
          printf '\n== outcomes on 2026-07-23 UTC ==\n'
          query "SELECT product, kind, result, count() AS events, min(occurred_at) AS first_at, max(occurred_at) AS last_at FROM linka_metric.product_outcomes_v2 FINAL WHERE occurred_at >= toDateTime('2026-07-23 00:00:00', 'UTC') AND occurred_at < toDateTime('2026-07-24 00:00:00', 'UTC') GROUP BY product, kind, result ORDER BY events DESC"
          printf '\n== ingestion ==\n'
          query "SELECT product, stream, status, count() AS batches, sum(record_count) AS records, max(ingested_at) AS last_update FROM linka_metric.ingest_batches_v2 FINAL GROUP BY product, stream, status ORDER BY last_update DESC"
          printf '\n== privacy ==\n'
          query "SELECT active, count() AS suppressions FROM linka_metric.privacy_suppressions_v2 FINAL GROUP BY active ORDER BY active DESC"
          REMOTE
      - name: Verify TTS release outcomes
        if: inputs.tts_app_version != '' && !inputs.resources_only
        env:
          TTS_APP_VERSION: ${{ inputs.tts_app_version }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          [[ "$TTS_APP_VERSION" =~ ^[a-f0-9]{40}$ ]]
          printf -v remote_metadata 'cd %q && docker compose images writer && docker compose ps writer' "$VPS_DEPLOY_PATH"
          printf -v remote_query 'cd %q && docker compose exec -T clickhouse sh -s -- %q' "$VPS_DEPLOY_PATH" "$TTS_APP_VERSION"
          ssh -o ControlMaster=auto -o ControlPersist=60 -o ControlPath=/tmp/tts-audit-%C \
            "$VPS_USER@$VPS_HOST" \
            "$remote_metadata"
          ssh -o ControlMaster=auto -o ControlPersist=60 -o ControlPath=/tmp/tts-audit-%C \
            "$VPS_USER@$VPS_HOST" \
            "$remote_query" <<'REMOTE'
          set -eu
          clickhouse-client --user "$CLICKHOUSE_ADMIN_USER" --password "$CLICKHOUSE_ADMIN_PASSWORD" \
            --format TSVWithNames \
            --query "SELECT source, result, count() AS events FROM linka_metric.product_outcomes_v2 FINAL WHERE product = 'linka-tts' AND kind = 'request_completed' AND app_version = '$1' GROUP BY source, result ORDER BY source, result"
          REMOTE
      - name: Inspect ClickHouse resource pressure
        if: inputs.resources_only
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          printf -v remote_command 'cd %q && docker compose exec -T clickhouse sh -s' "$VPS_DEPLOY_PATH"
          ssh -o ControlMaster=auto -o ControlPersist=60 -o ControlPath=/tmp/tts-audit-%C \
            "$VPS_USER@$VPS_HOST" \
            "$remote_command" <<'REMOTE'
          set -eu
          query() {
            clickhouse-client --user "$CLICKHOUSE_ADMIN_USER" --password "$CLICKHOUSE_ADMIN_PASSWORD" \
              --format TSVWithNames --max_threads 1 --max_memory_usage 67108864 --query "$1"
          }
          query "SELECT database, table, elapsed, progress, num_parts, total_size_bytes_compressed, memory_usage FROM system.merges LIMIT 8"
          query "SELECT metric, value FROM system.metrics WHERE metric IN ('MemoryTracking', 'BackgroundMergesAndMutationsPoolTask', 'Query') ORDER BY metric"
          query "SELECT metric, value FROM system.asynchronous_metrics WHERE metric IN ('MemoryResident', 'MemoryVirtual', 'OSMemoryAvailable', 'OSMemoryTotal', 'jemalloc.allocated', 'jemalloc.resident') ORDER BY metric"
          query "SELECT name, value FROM system.server_settings WHERE name IN ('max_server_memory_usage', 'max_server_memory_usage_to_ram_ratio', 'background_pool_size', 'background_merges_mutations_concurrency_ratio', 'mark_cache_size', 'uncompressed_cache_size') ORDER BY name"
          query "SELECT database, table, count() AS parts, sum(bytes_on_disk) AS bytes, sum(rows) AS rows FROM system.parts WHERE active GROUP BY database, table ORDER BY bytes DESC LIMIT 15"
          query "SELECT count() AS other_queries, sum(memory_usage) AS query_memory FROM system.processes WHERE query_id != currentQueryID()"
          REMOTE

  recovery:
    if: inputs.apply_recovery && !inputs.detach_archives
    runs-on: ubuntu-latest
    environment: production-vps
    concurrency:
      group: clickhouse-tts-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Validate the approved configuration
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('deploy/clickhouse/config.d/resources.xml').getroot()
          tasks = int(root.findtext('background_pool_size')) * int(root.findtext('background_merges_mutations_concurrency_ratio'))
          assert tasks == 2
          assert root.findtext('max_server_memory_usage_to_ram_ratio') == '0.85'
          for node in root.find('merge_tree'):
              assert 0 <= int(node.text) <= tasks
          for name in ('trace_log', 'processors_profile_log', 'text_log', 'metric_log', 'asynchronous_metric_log', 'query_metric_log', 'latency_log', 'query_log', 'part_log', 'error_log'):
              assert root.find(name).get('remove') == '1'
          PY
      - name: Verify startup with the production ClickHouse version
        run: |
          docker run -d --name clickhouse-recovery-check --memory 2g \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/deploy/clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro" \
            clickhouse/clickhouse-server:25.3.6.56-alpine
          timeout 180 bash -c 'until docker exec clickhouse-recovery-check clickhouse-client --query "SELECT 1"; do sleep 3; done'
          test "$(docker exec clickhouse-recovery-check clickhouse-client --query "SELECT value FROM system.server_settings WHERE name = 'background_pool_size'")" = 2
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  ControlMaster auto\n  ControlPersist 300\n  ControlPath /tmp/tts-recovery-%%C\n' > ~/.ssh/config
      - name: Apply configuration and restart only ClickHouse
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          remote_file="/tmp/linka-clickhouse-tts-$GITHUB_SHA.xml"
          scp deploy/clickhouse/config.d/resources.xml "$VPS_USER@$VPS_HOST:$remote_file"
          {
          printf 'set -- %q %q\n' "$VPS_DEPLOY_PATH" "$remote_file"
          cat <<'REMOTE'
          set -euo pipefail
          cd "$1"
          file=deploy/clickhouse/config.d/resources.xml
          backup="$file.before-tts-final-logs-20261016"
          test "$(sha256sum "$file" | cut -d' ' -f1)" = 904bd34f3717c719b9090c9c98d710242ab062403d457647cee681105c88fb5b
          test ! -e "$backup"
          cp -p "$file" "$backup"
          rollback() {
            trap - ERR
            cp "$backup" "$file"
            docker compose restart --timeout 60 clickhouse || true
            echo 'Recovery failed; original configuration restored.' >&2
            exit 1
          }
          trap rollback ERR
          # Preserve the inode used by the existing read-only file bind mount.
          cp "$2" "$file"
          docker compose restart --timeout 60 clickhouse
          container=$(docker compose ps -q clickhouse)
          ready=false
          for attempt in $(seq 1 60); do
            if test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy; then
              ready=true
              break
            fi
            sleep 4
          done
          if test "$ready" != true; then
            false
          fi
          trap - ERR
          rm -- "$2"
          docker compose ps clickhouse
          echo 'ClickHouse healthy; data volumes, schema, image and container limits unchanged.'
          echo COMPLETE_TTS_CLICKHOUSE_RESTART
          REMOTE
          } | ssh "$VPS_USER@$VPS_HOST" bash -s | tee "$RUNNER_TEMP/tts-clickhouse-restart.log"
          grep -qx COMPLETE_TTS_CLICKHOUSE_RESTART "$RUNNER_TEMP/tts-clickhouse-restart.log"
      - name: Remove the isolated startup-check container
        if: always()
        run: docker rm -f clickhouse-recovery-check || true

  detach-archives:
    if: inputs.detach_archives && !inputs.apply_recovery
    runs-on: ubuntu-latest
    environment: production-vps
    concurrency:
      group: clickhouse-tts-recovery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify reversible detach on the production ClickHouse version
        run: |
          docker run -d --name clickhouse-detach-check --memory 2g \
            -e CLICKHOUSE_SKIP_USER_SETUP=1 \
            -v "$PWD/deploy/clickhouse/config.d/resources.xml:/etc/clickhouse-server/config.d/resources.xml:ro" \
            clickhouse/clickhouse-server:25.3.6.56-alpine
          timeout 180 bash -c 'until docker exec clickhouse-detach-check clickhouse-client --query "SELECT 1"; do sleep 3; done'
          docker exec clickhouse-detach-check clickhouse-client --multiquery --query \
            'CREATE TABLE system.tts_detach_check (value UInt8) ENGINE=MergeTree ORDER BY tuple(); INSERT INTO system.tts_detach_check VALUES (1); DETACH TABLE system.tts_detach_check PERMANENTLY SYNC;'
          test "$(docker exec clickhouse-detach-check clickhouse-client --query 'EXISTS TABLE system.tts_detach_check')" = 0
          docker exec clickhouse-detach-check clickhouse-client --query 'ATTACH TABLE system.tts_detach_check'
          test "$(docker exec clickhouse-detach-check clickhouse-client --query 'SELECT count() FROM system.tts_detach_check')" = 1
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  ControlMaster auto\n  ControlPersist 300\n  ControlPath /tmp/tts-detach-%%C\n' > ~/.ssh/config
      - name: Preserve definitions and detach only the approved archives
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          {
          printf 'set -- %q\n' "$VPS_DEPLOY_PATH"
          cat <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test "$(sha256sum deploy/clickhouse/config.d/resources.xml | cut -d' ' -f1)" = 4eb7ab832dee898fd77d49dd720a93742a3baa2e3e5b4ec9535ba783080bab46
          backup=$(mktemp -d "$PWD/.tts-log-archive-definitions.XXXXXXXX")
          tables=(query_log part_log error_log)
          query() {
            docker compose exec -T clickhouse sh -c \
              'exec clickhouse-client --user "$CLICKHOUSE_ADMIN_USER" --password "$CLICKHOUSE_ADMIN_PASSWORD" --query "$1"' sh "$1" < /dev/null
          }
          for table in "${tables[@]}"; do
            query "SHOW CREATE TABLE system.$table FORMAT TSVRaw" > "$backup/$table.sql"
            test -s "$backup/$table.sql"
          done
          echo 'Definitions backed up before the first DETACH; data files are retained.'
          for table in "${tables[@]}"; do
            query "DETACH TABLE system.$table PERMANENTLY SYNC"
            test "$(query "EXISTS TABLE system.$table")" = 0
            echo "Detached system.$table; restore with ATTACH TABLE system.$table"
          done
          query "SELECT metric, value FROM system.metrics WHERE metric = 'MemoryTracking'"
          echo 'No application tables, data files or table rows were deleted.'
          echo COMPLETE_TTS_ARCHIVE_DETACH
          REMOTE
          } | ssh "$VPS_USER@$VPS_HOST" bash -s | tee "$RUNNER_TEMP/tts-archive-detach.log"
          test "$(grep -c '^Detached system\.' "$RUNNER_TEMP/tts-archive-detach.log")" = 3
          grep -qx COMPLETE_TTS_ARCHIVE_DETACH "$RUNNER_TEMP/tts-archive-detach.log"
      - name: Remove the isolated detach-check container
        if: always()
        run: docker rm -f clickhouse-detach-check || true
