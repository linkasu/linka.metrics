name: TTS restoration image

on:
  push:
    branches: [fix/tts-return-openai-metrics-20261016]
    paths-ignore: [.github/workflows/clickhouse-audit.yml]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binary: [collector, writer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: BINARY=${{ matrix.binary }}
          push: true
          tags: ghcr.io/linkasu/linka.plays-metric-${{ matrix.binary }}:sha-${{ github.sha }}
